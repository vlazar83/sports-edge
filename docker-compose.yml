version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sports-edge-db
    environment:
      POSTGRES_USER: sports_user
      POSTGRES_PASSWORD: sports_password
      POSTGRES_DB: sports_edge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_user -d sports_edge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
